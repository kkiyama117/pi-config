name: release

# On every `pi-config-v*` tag push:
#   1. create a GitHub Release for the tag
#   2. build a podman image of this environment (pi + config) and push it to
#      ghcr.io/<owner>/pi-config, tagged with the git tag and `latest`
#
# Trigger:
#   git tag pi-config-vYYYY-MM-DD-N
#   git push origin pi-config-vYYYY-MM-DD-N
#
# Pull with apptainer:
#   apptainer pull docker://ghcr.io/<owner>/pi-config:pi-config-vYYYY-MM-DD-N

on:
  push:
    tags:
      - 'pi-config-v*'

permissions:
  contents: write   # create GitHub Release
  packages: write   # push image to GHCR

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"

  image:
    name: Build & push podman image
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Ensure podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y podman
          fi
          podman --version

      - name: Log in to GHCR
        run: podman login ghcr.io -u "${{ github.actor }}" -p "${{ secrets.GITHUB_TOKEN }}"

      - name: Build image
        run: |
          podman build \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.version=${{ github.ref_name }}" \
            -t "$IMAGE:${{ github.ref_name }}" \
            -t "$IMAGE:latest" \
            .

      - name: Push image
        run: |
          podman push "$IMAGE:${{ github.ref_name }}"
          podman push "$IMAGE:latest"
