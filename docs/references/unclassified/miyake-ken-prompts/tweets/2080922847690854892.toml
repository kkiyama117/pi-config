[content]
text = """
note書きました。

同じSKILL.mdをClaude Code、Codex、Grok Buildへ置けば、同じように動く。

そう考えたくなりますが、現状はそこまで単純ではありません。

共通化が進んだのは、

・SKILL.md
・scripts
・references
・assets
・Progressive Disclosure

一方で、まだ差が大きいのは、

・Skillの起動条件
・Tool権限
・Hooks
・Sandbox
・Memory
・評価方法
・承認と停止

です。

つまり、標準化されたのは主にSkillの外形であり、実行契約までは揃っていません。

実務者が採っている対策も調べました。

・共通SKILL.mdを使う
・一つの正本を同期する
・ランタイム別に生成する
・決定的処理をScriptへ移す
・Multi-model Evalで実測する
・別モデルへ委譲する

現時点の結論は、
Author once, adapt per harness, verify per runtime.

同じ文章でモデルの歩調を揃えるのではなく、モデル中立の契約から各ハーネス向け成果物を生成し、共通の出口条件で検証する。

Agent Skills標準化と、マルチモデル互換の現在地を整理しました。
https://note.com/tasty_dunlin998/n/n7a3ac28425f3

#AgentSkills #ClaudeCode #Codex #Grok #AIエージェント #AIハーネス
"""
