向大家强烈推荐 LoopX —— 由字节跳动火山引擎 OpenViking 核心贡献者（清华 EE / ByteDance AML 的黄瑞腾 @huangruiteng）亲手打造的 Loop Engineering + Graph Engineering 开源项目。

它是一个轻量级「状态内核」，专为超长程 AI Agent 设计：让 Agent 在无人干预下稳定运行 200+ 小时 而不漂移。核心把 Goal、Todo/Gate、Evidence、Authority、Handoff 等外置成可执行控制面，像一块「Agent 专属 Kanban」，既管 loop，又管状态图，支持 auto PR 修复、AutoML 实验、自进化能力升级等真实场景。已与 OpenViking 深度合作，开源仓库完整可跑。

GitHub：https://github.com/huangruiteng/loopx
