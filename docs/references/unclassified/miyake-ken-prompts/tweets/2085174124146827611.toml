• MAGMA: https://arxiv.org/abs/2601.03236
• Mnemis: https://aclanthology.org/2026.acl-long.1096/
• EverMemOS: https://aclanthology.org/2026.acl-long.2125/
• RecMem: https://aclanthology.org/2026.findings-acl.1619/
• Taxonomy: https://arxiv.org/abs/2602.05665
#AgentMemory #GraphRAG #LLMAgents
