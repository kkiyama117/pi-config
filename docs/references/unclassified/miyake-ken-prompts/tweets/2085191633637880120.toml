[content]
text = """
【衝撃】
200ページのPDFが0.47秒で読み解けます😳
元は2.8秒。しかも、ブラウザの中だけで完結します。
https://x.com/nickscamara_/status/2084157897919865224/video/1
中で何をしているかというと👇

・文字入りか、画像スキャンかを10〜50ミリ秒で判定して振り分ける
・座標と書体を保ったまま本文を抜き、見出しや表つきの整形テキストへ変換
・表の取り出し精度は200件の比較で0.814の首位。読み順の再現も1位
・画像の読み取り処理を一切通さないので、手元のパソコンだけで完結する

作ったのはFirecrawlのチーム、言語はRustでライセンスはMIT。
入れ方はnpmでもpipでもcargoでも選べて、変換用のコマンドも同梱されています。
つまり、資料の山をAIに渡す前の待ち時間が、工程ごと消えるということ。

書類のPDFを毎日触っている人ほど、効き方が露骨に変わります。
オープンソースはこちら👇

https://github.com/firecrawl/pdf-inspector
"""
