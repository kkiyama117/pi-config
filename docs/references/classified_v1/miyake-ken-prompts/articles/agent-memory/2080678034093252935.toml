[content]
text = """
AIエージェントに長時間タスクをやらせていると、途中で分かったはずのことを忘れたかのように同じ失敗を繰り返すことがある。そんなクセに「記憶の入れ方」で対処する論文が出ていた(https://arxiv[.]org/html/2607.08716v1)。

長く動き続けるAIエージェントには「behavioral state decay(行動状態減衰)」と呼べる問題があるという。タスクの要件や、途中で分かった環境の事実、過去に失敗した試行などが、会話履歴の中にはまだ残っているのに、次の判断には反映されなくなっていく現象のことだ。情報自体は消えていないのに、なぜか「思い出せない」状態に陥る。

この論文が提案するのは、実際にタスクをこなす「アクションエージェント」本体はそのままに、並行して動く「メモリエージェント」をもう1体追加する仕組みだ。メモリエージェントは2段階で動く。まず状況・知識・手続き的な記録という3種類の情報を、専用のメモリ領域(メモリバンク)に書き込む。そのうえで直近の記録を踏まえ、「今アクションエージェントに一言伝えるべきか、それとも黙っておくべきか」を判断する。記録した情報を常に全部見せるのでも毎回口を挟むのでもなく、「黙る」という選択肢があるのがポイントらしい。

実際、比較実験でもこの「黙る」判断の有無が効いている。メモリバンクの中身を毎回全部見せる方式にすると平均正答率がフルシステムより2.8ポイント低くなり、逆に毎回必ず一言差し込む方式にしても、ドメインごとの改善バランスはフルシステムに劣る。単に記憶を増やすだけでも、毎回口出しするだけでも足りず、「今伝えるべきか」を都度判断する仕組みそのものが効果を生んでいるようだ。

コマンドライン操作を行うTerminal-Bench 2.0では、アクションエージェント役のClaude Sonnet 4.5の正答率が37.6%から45.9%(+8.3pt)に、接客対応のような対話型タスクを行うτ-Benchでは55.0%から61.8%(+6.8pt)に伸びている。より強いClaude Opus 4.6でも+2.4pt/+2.5ptの改善が残っており、単に非力なモデルの穴埋めをしているわけではなさそうだ。

面白いのは航空会社対応の事例で、ユーザーが「ゴールド会員だ」と自己申告したのに対し、実際にツールで確認すると通常会員だった。メモリエージェントなしのベースラインはユーザーの申告通りに補償を出してしまったが、メモリエージェント付きだと「検証済みの記録に基づけ」と一言差し込んで誤った補償を防いでいる。

重みが公開されているオープンウェイトモデルのQwen3.5-27Bに、この「いつ声をかけるか」の判断自体を学習させる実験もしていた。アクションエージェントをQwen3.5-122B-A10Bに変え、教師あり微調整と強化学習でメモリエージェント役を鍛えると、Terminal-Bench 2.0で37.6%から41.1%まで正答率が伸びている。プロンプトで指示するだけでなく、学習でも同じ効果を再現できる可能性を示す結果だ。
"""
