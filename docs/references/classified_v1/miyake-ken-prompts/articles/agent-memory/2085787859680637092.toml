This paper is f*cking brilliant
  
A computer science paper formalizes filesystem-based memory as the long-term storage architecture for autonomous AI agents  
  
The result: agents organizing their own memory trees as markdown files roughly halve retrieval costs on large context stores  
  
The crazy part is how tool harnesses reshape memory organization as strongly as swapping the underlying LLM  
  
A management agent organizes incoming experience into hierarchical markdown files, a search agent retrieves paths with citations, and an execution agent distills trajectories into skills  
  
Most agent developers rely on opaque vector stores or flat database logs  
  
This study converts the local file system into a structured, inspectable memory store  
  
