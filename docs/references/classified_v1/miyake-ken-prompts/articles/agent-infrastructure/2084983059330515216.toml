・マルチリポジトリで動かせる
・環境をコードで定義できる
・Computer Useがある
・スマホアプリもある

パッと挙げただけでこれ。他にも無限にある。

これを1人で開発できるなら、CursorとかAnthropicに入社できるから早く面接に行った方が良い。年収5,000万円いける💰

次のフロンティアと思って彼らトップエンジニアたちが最新のモデルを無制限に使って作っているものですからね。そう簡単に作れるわけがない。
