[content]
text = """
关于如何让 Agent 稳定推进长程开发，我一般会在 AGENTS.md 中这样声明

- 引入 PLANS.md 和 plans/目录，让施工计划先沉淀在 plans/xxx.md 里并在 PLANS.md 建立索引，要求开工前检查、完工后删除，仅保留 git commit log 留档

- 引入 DOCS.md 和 docs/目录，在推进开发的过程中自动将文档沉淀在 docs/xxx.md 里并在 DOCS.md 建立索引

需要注意文档不能施工后就删除，这里可以建立二级甚至三级索引，防止单个文件无限膨胀

- 在前端优化、回测评估、性能调优等有明确反馈的改进中，撰写专门的规范（比如改前端要看着浏览器）并在 AGENTS.md 或 PLANS.md 中建立索引

- 提出北极星指标，要求 AI 按照北极星指标推进，从而提高 AI 推理过程的对齐质量

以上，做完这些就可以把代码扔给 Agent 挂个/goal 或者/loop 自动推进了
"""
